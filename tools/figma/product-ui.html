<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e0d1;color:#41372e;font:16px/1.7 system-ui}button{font:inherit;min-height:48px;padding:8px 20px;border:1px solid #bba582;border-radius:12px;background:#faf3e6;color:#41372e;cursor:pointer}.toolbar{display:flex;gap:12px;padding:12px 20px}.phone{width:390px;margin:auto;padding:0 16px 20px}.nav{height:60px;display:flex;justify-content:space-between;align-items:center}.binding{width:358px;height:610px;background:#695243;box-shadow:3px 4px #bca88a,6px 7px #f4e6cc,8px 9px #695243,10px 16px 20px #41372e33}.leaf{background:#f6edd9}.leaf img{width:100%;height:100%;display:block;pointer-events:none}.actions{display:flex;justify-content:space-between;margin-top:24px;gap:18px}.actions button{flex:1}.actions button:last-child{background:#876020;color:white}.report{padding:20px}h2{font-size:20px}#status{padding:12px 20px}button:disabled{opacity:.4}.note{padding:12px 20px;font-size:14px;color:#75665d}
</style><div class="toolbar"><button id="showMotion">连续翻页</button><button id="showReport">页面与检查</button></div><div id="motion"><div class="phone"><div class="nav"><span>忆谈 · 第二版原始书页</span><span id="number">1 / 6</span></div><div class="binding"><div id="book"></div></div><div class="actions"><button id="previous">上一页</button><button id="next">翻开这本书</button></div></div><p class="note">拖动页角可以跟随手指翻页；松开时完成或收回。图片与文字取自当前 Figma 原始书页。此预览只演示设计。</p></div><div id="report" class="report" hidden></div><p id="status" role="status">正在读取书页</p>
<script>/*LIBRARY*/</script><script>
let book;let turns=0;const el=id=>document.getElementById(id);
el('showMotion').onclick=()=>{el('report').hidden=true;};el('showReport').onclick=()=>{el('report').style.cssText='position:absolute;inset:72px 0 0;z-index:10;overflow:auto;background:#f9f3e6';el('report').hidden=false;};
function sync(){const i=book.getCurrentPageIndex();el('number').textContent=(i+1)+' / 6';el('previous').disabled=i===0;el('next').disabled=i===5;el('next').textContent=i===0?'翻开这本书':'下一页';el('status').textContent='当前第 '+(i+1)+' 页 · 已完成 '+turns+' 次连续翻页';}
onmessage=e=>{const data=e.data.pluginMessage;if(!data||book)return;if(data.progress){el('status').textContent=data.progress;return;}el('report').replaceChildren();for(const line of data.report){const p=document.createElement('p');p.textContent=line;el('report').append(p);}for(const [i,src]of data.pages.entries()){const leaf=document.createElement('div');leaf.className='leaf';leaf.dataset.density=i===0?'hard':'soft';const img=document.createElement('img');img.src=src;img.alt=data.names[i];leaf.append(img);el('book').append(leaf);}book=new St.PageFlip(el('book'),{width:358,height:610,size:'fixed',usePortrait:true,startPage:0,showCover:true,flippingTime:750,drawShadow:true,maxShadowOpacity:.32,mobileScrollSupport:false,useMouseEvents:true,showPageCorners:true});book.on('flip',()=>{turns++;sync();});book.on('changeState',e=>{if(e.data==='read')sync();else{el('status').textContent='翻页状态：'+e.data;el('previous').disabled=true;el('next').disabled=true;}});book.loadFromHTML(document.querySelectorAll('.leaf'));turns=0;sync();};
el('previous').onclick=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?book.turnToPrevPage():book.flipPrev('bottom');el('next').onclick=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?book.turnToNextPage():book.flipNext('bottom');
parent.postMessage({pluginMessage:{type:'ready'}},'*');
let animationFrames=0;function observeFrame(){animationFrames++;requestAnimationFrame(observeFrame);}requestAnimationFrame(observeFrame);
const timing=document.createElement('p');timing.className='note';document.body.append(timing);setInterval(()=>{timing.textContent='动画时钟：'+animationFrames+' 帧；窗口：'+document.visibilityState+'；书页状态：'+(book?book.getState():'loading');},1000);
window.addEventListener('error',event=>{timing.textContent='预览错误：'+event.message;});
</script></html>
